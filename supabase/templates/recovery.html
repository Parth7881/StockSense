<!doctype html>
<html lang="en">
  <body style="background:#f7f5ef;color:#18251d;font-family:Arial,sans-serif;margin:0;padding:32px">
    <main style="background:#ffffff;border:1px solid #dfe4df;border-radius:16px;margin:0 auto;max-width:520px;padding:32px">
      <p style="color:#1f5b3b;font-size:14px;font-weight:700;letter-spacing:.08em;margin:0">STOCKSENSE</p>
      <h1 style="font-size:28px;margin:24px 0 12px">Reset your password</h1>
      <p style="color:#536158;line-height:1.6">Enter this one-time recovery code in StockSense:</p>
      <p style="font-size:32px;font-weight:700;letter-spacing:.25em;margin:28px 0">{{ .Token }}</p>
      <p style="color:#536158;font-size:13px;line-height:1.6">If you did not request this code, you can safely ignore this email.</p>
    </main>
  </body>
</html>
